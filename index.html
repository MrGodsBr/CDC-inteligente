<script>
  let currentInput = "";
  let currentArticleId = null;
  let cdcDatabase = null;
  let favorites = JSON.parse(localStorage.getItem('cdc_favorites')) || [];
  /*
   * ============================================================
   * BANCO LOCAL
   * ============================================================
   *
   * O cdc.json é sempre a fonte principal.
   * A IA nunca substitui o conteúdo desse arquivo.
   */
  async function getDatabase() {
    if (cdcDatabase) return cdcDatabase;
    try {
      const response = await fetch('cdc.json?v=' + Date.now(), {
        cache: 'no-store'
      });
      if (!response.ok) {
        throw new Error('Erro ao carregar cdc.json');
      }
      cdcDatabase = await response.json();
      return cdcDatabase;
    } catch (err) {
      console.error("Erro ao carregar cdc.json:", err);
      return null;
    }
  }
  /*
   * ============================================================
   * LOCALIZA ARTIGO NO BANCO LOCAL
   * ============================================================
   */
  function getArticleFromData(db, artId) {
    if (!db || !Array.isArray(db)) return null;
    const num = parseInt(artId, 10);
    return db.find(article => {
      return parseInt(article.id || article.numero, 10) === num;
    }) || null;
  }
  /*
   * ============================================================
   * TECLADO
   * ============================================================
   */
  function pressNum(num) {
    if (currentInput.length < 3) {
      currentInput += num;
      updateDisplay();
    }
  }
  function clearNum() {
    currentInput = "";
    updateDisplay();
  }
  function updateDisplay() {
    document.getElementById("display").innerText = currentInput;
  }
  /*
   * ============================================================
   * TELAS
   * ============================================================
   */
  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
  }
  function showHome() {
    clearNum();
    switchScreen('home-screen');
  }
  function openSearchScreen() {
    document.getElementById("search-term-input").value = "";
    document.getElementById("search-results-container").innerHTML = "";
    switchScreen('search-screen');
  }
  /*
   * ============================================================
   * ABRIR ARTIGO PELO TECLADO
   * ============================================================
   */
  function searchArticleFromKeypad() {
    if (!currentInput) return;
    fetchAndDisplayArticle(
      parseInt(currentInput, 10).toString()
    );
  }
  /*
   * ============================================================
   * ESCAPA HTML
   *
   * Evita que texto vindo da IA seja inserido diretamente
   * como HTML.
   * ============================================================
   */
  function escapeHtml(text) {
    if (text === null || text === undefined) {
      return "";
    }
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  /*
   * ============================================================
   * ABRIR ARTIGO
   *
   * O conteúdo principal SEMPRE vem do cdc.json.
   *
   * extraIaText é opcional.
   *
   * Se existir, aparece somente como complemento 🌎.
   * ============================================================
   */
  async function fetchAndDisplayArticle(
    artId,
    extraIaText = null
  ) {
    currentArticleId = artId;
    switchScreen('article-screen');
    updateFavButtonState();
    const titleElement =
      document.getElementById("article-title");
    const contentElement =
      document.getElementById("article-content");
    const iaContainer =
      document.getElementById("ia-extra-container");
    titleElement.innerText = `Artigo ${artId}`;
    contentElement.innerHTML =
      `<div class="loading-spinner">
        Carregando banco local...
       </div>`;
    iaContainer.innerHTML = "";
    /*
     * CARREGA O BANCO LOCAL
     */
    const db = await getDatabase();
    const articleObj =
      getArticleFromData(db, artId);
    /*
     * ARTIGO ENCONTRADO
     */
    if (articleObj && articleObj.texto) {
      titleElement.innerText =
        articleObj.titulo || `Artigo ${artId}`;
      /*
       * IMPORTANTE:
       *
       * Aqui entra EXATAMENTE o conteúdo
       * existente no banco local.
       */
      contentElement.innerHTML =
        articleObj.texto;
      /*
       * ========================================================
       * COMPLEMENTO DA IA
       * ========================================================
       *
       * A IA não altera o artigo.
       *
       * Ela aparece somente abaixo do conteúdo oficial.
       */
      if (
        extraIaText &&
        String(extraIaText).trim() !== ""
      ) {
        const safeIaText =
          escapeHtml(extraIaText)
            .replace(/\n/g, "<br>");
        iaContainer.innerHTML = `
          <div class="ia-extra-box">
            <div class="ia-extra-title">
              🌎 Complemento da IA
            </div>
            <div>
              ${safeIaText}
            </div>
          </div>
        `;
      }
      /*
       * Volta o artigo para o topo.
       */
      const bodyEl =
        document.querySelector('.article-body');
      if (bodyEl) {
        bodyEl.scrollTop = 0;
      }
      return;
    }
    /*
     * ARTIGO NÃO ENCONTRADO
     */
    contentElement.innerHTML = `
      <p class="empty-msg">
        Artigo ${escapeHtml(artId)}
        não encontrado no banco local.
      </p>
    `;
  }
  /*
   * ============================================================
   * PESQUISA HÍBRIDA
   *
   * REGRA:
   *
   * 1. Banco local primeiro.
   * 2. IA depois.
   * 3. Resultado final continua sendo baseado no banco local.
   * 4. IA somente complementa.
   * ============================================================
   */
  async function performTextSearch() {
    const input =
      document.getElementById("search-term-input");
    const container =
      document.getElementById("search-results-container");
    const term =
      input.value.trim();
    if (!term) return;
    container.innerHTML = `
      <div class="loading-spinner">
        Pesquisando no banco local...
      </div>
    `;
    /*
     * ============================================================
     * 1. CARREGAR BANCO LOCAL
     * ============================================================
     */
    const db = await getDatabase();
    if (!db) {
      container.innerHTML = `
        <div class="empty-msg">
          Não foi possível carregar o banco local.
        </div>
      `;
      return;
    }
    /*
     * ============================================================
     * 2. PESQUISA LOCAL
     * ============================================================
     */
    const termLower =
      term.toLowerCase();
    const matchesLocal =
      db.filter(article => {
        const titulo =
          String(article.titulo || "")
            .toLowerCase();
        const texto =
          String(article.texto || "")
            .toLowerCase();
        const numero =
          String(article.id || article.numero || "")
            .toLowerCase();
        return (
          titulo.includes(termLower) ||
          texto.includes(termLower) ||
          numero === termLower
        );
      });
    /*
     * Remove loading
     */
    container.innerHTML = "";
    /*
     * ============================================================
     * 3. RESULTADOS DO BANCO LOCAL
     * ============================================================
     */
    const localHeader =
      document.createElement("div");
    localHeader.className =
      "section-header";
    localHeader.innerText =
      "📄 Resultados do Banco Local";
    container.appendChild(localHeader);
    if (matchesLocal.length > 0) {
      matchesLocal.forEach(article => {
        const item =
          document.createElement("div");
        item.className =
          "result-item";
        /*
         * Cria uma prévia somente para a lista.
         * O artigo completo continua no banco.
         */
        const tempDiv =
          document.createElement("div");
        tempDiv.innerHTML =
          article.texto || "";
        const plainText =
          tempDiv.textContent ||
          tempDiv.innerText ||
          "";
        const preview =
          plainText.length > 150
            ? plainText.substring(0, 150) + "..."
            : plainText;
        item.innerHTML = `
          <div class="result-title">
            ${escapeHtml(
              article.titulo ||
              `Artigo ${article.id || article.numero}`
            )}
          </div>
          <div class="result-snippet">
            ${escapeHtml(preview)}
          </div>
        `;
        item.onclick = () => {
          fetchAndDisplayArticle(
            article.id || article.numero
          );
        };
        container.appendChild(item);
      });
    } else {
      container.innerHTML += `
        <div class="empty-msg">
          Nenhum artigo correspondente
          foi encontrado no banco local.
        </div>
      `;
    }
    /*
     * ============================================================
     * 4. IA COMO COMPLEMENTAÇÃO
     * ============================================================
     *
     * A IA só é consultada depois da pesquisa local.
     *
     * Ela não cria o artigo.
     *
     * Ela não substitui o artigo.
     *
     * Ela apenas pode encontrar artigos locais relacionados
     * e fornecer uma explicação complementar.
     */
    const iaHeader =
      document.createElement("div");
    iaHeader.className =
      "section-header ia";
    iaHeader.innerText =
      "🌎 Complementos encontrados pela IA";
    container.appendChild(iaHeader);
    const iaLoading =
      document.createElement("div");
    iaLoading.className =
      "loading-spinner";
    iaLoading.innerText =
      "A IA está analisando se existe algum complemento relevante...";
    container.appendChild(iaLoading);
    try {
      const response =
        await fetch('/api/buscar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            query: term
          })
        });
      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }
      const data =
        await response.json();
      iaLoading.remove();
      /*
       * ========================================================
       * A IA PRECISA DEVOLVER IDs QUE EXISTAM NO BANCO LOCAL
       * ========================================================
       */
      const iaResults =
        Array.isArray(data.resultados)
          ? data.resultados
          : [];
      /*
       * Só aceitamos artigos que realmente
       * estejam no banco local.
       */
      const validIaResults =
        iaResults.filter(result => {
          const article =
            getArticleFromData(
              db,
              result.id
            );
          return (
            article &&
            result.explicacao_ia &&
            String(result.explicacao_ia).trim() !== ""
          );
        });
      if (validIaResults.length === 0) {
        const emptyIa =
          document.createElement("div");
        emptyIa.className =
          "empty-msg";
        emptyIa.innerText =
          "Nenhum complemento relevante da IA foi encontrado.";
        container.appendChild(emptyIa);
      } else {
        validIaResults.forEach(result => {
          const article =
            getArticleFromData(
              db,
              result.id
            );
          if (!article) return;
          const item =
            document.createElement("div");
          item.className =
            "result-item";
          const explanation =
            String(result.explicacao_ia);
          /*
           * Mostra que é complemento da IA.
           */
          item.innerHTML = `
            <div class="result-title">
              🌎 ${escapeHtml(
                article.titulo ||
                `Artigo ${result.id}`
              )}
            </div>
            <div class="result-snippet">
              ${escapeHtml(explanation)}
            </div>
          `;
          /*
           * Ao clicar:
           *
           * 1. Busca artigo no banco local.
           * 2. Mostra artigo completo.
           * 3. Mostra complemento IA abaixo.
           */
          item.onclick = () => {
            fetchAndDisplayArticle(
              result.id,
              explanation
            );
          };
          container.appendChild(item);
        });
      }
    } catch (error) {
      console.error(
        "Erro na consulta da IA:",
        error
      );
      if (iaLoading) {
        iaLoading.remove();
      }
      const errorIa =
        document.createElement("div");
      errorIa.className =
        "empty-msg";
      errorIa.innerText =
        "🌎 A IA não está disponível no momento. Os resultados do banco local continuam disponíveis.";
      container.appendChild(errorIa);
    }
  }
  /*
   * ============================================================
   * NAVEGAÇÃO ENTRE ARTIGOS
   * ============================================================
   */
  function navArticle(direction) {
    let num =
      parseInt(currentArticleId, 10);
    if (isNaN(num)) {
      num = 1;
    }
    num += direction;
    if (num < 1) {
      num = 1;
    }
    if (num > 119) {
      num = 119;
    }
    fetchAndDisplayArticle(
      num.toString()
    );
  }
  /*
   * ============================================================
   * FAVORITOS
   * ============================================================
   */
  function toggleFavorite() {
    if (!currentArticleId) return;
    const index =
      favorites.indexOf(
        String(currentArticleId)
      );
    if (index === -1) {
      favorites.push(
        String(currentArticleId)
      );
    } else {
      favorites.splice(index, 1);
    }
    localStorage.setItem(
      'cdc_favorites',
      JSON.stringify(favorites)
    );
    updateFavButtonState();
  }
  function updateFavButtonState() {
    const btn =
      document.getElementById(
        "fav-toggle-btn"
      );
    if (
      favorites.includes(
        String(currentArticleId)
      )
    ) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  }
  /*
   * ============================================================
   * FAVORITOS
   * ============================================================
   */
  async function openFavorites() {
    const container =
      document.getElementById(
        "fav-list-container"
      );
    container.innerHTML = "";
    if (favorites.length === 0) {
      container.innerHTML = `
        <div class="empty-msg">
          Nenhum artigo favoritado ainda.
        </div>
      `;
    } else {
      const db =
        await getDatabase();
      favorites.forEach(id => {
        let title =
          `Artigo ${id}`;
        let preview =
          "Toque para abrir...";
        const articleObj =
          getArticleFromData(
            db,
            id
          );
        if (
          articleObj &&
          articleObj.texto
        ) {
          const tempDiv =
            document.createElement("div");
          tempDiv.innerHTML =
            articleObj.texto;
          const text =
            tempDiv.textContent ||
            tempDiv.innerText ||
            "";
          preview =
            text.length > 80
              ? text.substring(0, 80) + "..."
              : text;
          title =
            articleObj.titulo ||
            title;
        }
        const item =
          document.createElement("div");
        item.className =
          "fav-item";
        item.innerHTML = `
          <div>
            <div style="
              font-weight: bold;
              color: #0d3859;
            ">
              ${escapeHtml(title)}
            </div>
            <div style="
              font-size: 13px;
              color: #666;
            ">
              ${escapeHtml(preview)}
            </div>
          </div>
          <svg
            class="icon"
            style="color: #f39c12;"
            viewBox="0 0 24 24">
            <path d="
              M12 17.27
              L18.18 21
              l-1.64-7.03
              L22 9.24
              l-7.19-.61
              L12 2
              9.19 8.63
              2 9.24
              l5.46 4.73
              L5.82 21
              z
            "/>
          </svg>
        `;
        item.onclick = () => {
          fetchAndDisplayArticle(id);
        };
        container.appendChild(item);
      });
    }
    switchScreen(
      'favorites-screen'
    );
  }
</script>
